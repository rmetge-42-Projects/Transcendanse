name: Moulinette CI

on:
  pull_request:
    branches:
      - delphine
        # To modify to dev after testing the testing on my branch

jobs:
  test-and-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Dummy Environment
        run: cp .env.example .env

      - name: Build and Start Infrastructure
        run: make all

      - name: Wait for Vault and DB Initialization
        run: sleep 20

      - name: Run Backend Tests
        # The -T flag is critical in CI to prevent TTY terminal errors
        run: docker compose exec -T backend npm test

      - name: Teardown Infrastructure
        if: always()
        run: make fclean
