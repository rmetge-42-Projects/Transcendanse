services:
  database:
    image: postgres:15
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - vol_data:/var/lib/postgresql/data
    restart: always

  backend:
    build:
      context: ./backend
    depends_on:
      database:
        condition: service_started
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: http://vault:8200
      PORT: 3000
    volumes:
      - vol_back:/app/uploads
      - vol_vault:/vault/secrets:ro
    command: sh entrypoint.sh

  frontend:
    build:
      context: ./front
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: https://transcendance42.fr:8443

  vault:
    image: hashicorp/vault:1.13
    ports:
      - "8200:8200"
    env_file:
      - .env
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
    volumes:
      - vol_vault:/vault/file
      - ./Vault/vault.conf:/vault/config/vault.conf
      - ./vault-init.sh:/vault-init.sh
    cap_add:
      - IPC_LOCK
    command: sh /vault-init.sh
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    build:
      context: ./nginx
    restart: always
    ports:
      - "8443:443"
      - "8080:80"
    environment:
      MODSEC_RULE_ENGINE: on
      MODSEC_REQ_BODY_LIMIT: 26214400
      MODSEC_REQ_BODY_NO_FILES_LIMIT: 26214400
    healthcheck:
      test: ["CMD-SHELL", "curl -k -f https://localhost:443 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  backup_monitor:
      image: postgres:15
      depends_on:
        database:
          condition: service_started
      environment:
        PGHOST: database
        PGUSER: ${DB_USER}
        PGPASSWORD: ${DB_PASSWORD}
        PGDATABASE: ${DB_NAME}
      volumes:
        - vol_backup:/backups
        - ./backup.sh:/backup.sh:ro
      command: sh /backup.sh

volumes:
  vol_data:
  vol_back:
  vol_vault:
  vol_backup:
